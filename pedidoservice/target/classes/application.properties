# Configuraci�n b�sica de la aplicaci�n
spring.application.name=pedidoservice
server.port=8083

# Configuraci�n de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/perfulandia_pedidos
spring.datasource.username=root
spring.datasource.password=

# Configuraci�n de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# URL del servicio de productos
productoservice.url=http://localhost:8084/api/productos

# Configuraci�n de Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.version=1.0.0
springdoc.packagesToScan=com.perfulandia.pedidoservice
springdoc.show-actuator=true

# Personalizaci�n de la interfaz Swagger UI
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.syntax-highlight.active=true
springdoc.swagger-ui.syntax-highlight.theme=agate//localhost:8084/api/productos